<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>联系我们 | 万能在线工具箱 DevTools Box</title>
    <meta name="description" content="通过反馈表单或电子邮件联系万能在线工具箱官方团队。">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://w3.org' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧰</text></svg>">
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        :root {
            --bg-base: #090d16;
            --sidebar-bg: rgba(20, 27, 45, 0.5);
            --card-bg: rgba(26, 37, 63, 0.4);
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
            --border: rgba(255, 255, 255, 0.07);
            --accent: #10b981;
            --accent-gradient: linear-gradient(135deg, #10b981, #06b6d4);
            --accent-glow: rgba(16, 185, 129, 0.25);
        }

        body {
            font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
            background: linear-gradient(135deg, #090d16, #0f172a, #0b132b, #090d16);
            background-size: 400% 400%;
            color: var(--text-main);
            min-height: 100vh;
            -webkit-font-smoothing: antialiased;
        }

        .top-glow-bar {
            height: 4px;
            background: linear-gradient(90deg, #10b981, #06b6d4, #3b82f6, #10b981);
            background-size: 200% auto;
            animation: flowLight 4s linear infinite;
            width: 100%;
        }

        @keyframes flowLight {
            0% { background-position: 0% 50%; }
            100% { background-position: 200% 50%; }
        }

        .lang-bar {
            background: rgba(9, 13, 22, 0.7);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border-bottom: 1px solid var(--border);
            padding: 0.8rem 2rem;
            display: flex;
            justify-content: flex-end;
            position: sticky;
            top: 0;
            z-index: 110;
        }

        .lang-btn {
            background: var(--accent-gradient);
            color: #fff;
            padding: 0.4rem 1.2rem;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            border-radius: 99px;
            box-shadow: 0 4px 12px var(--accent-glow);
            border: none;
        }

        .layout-wrapper {
            display: flex;
            max-width: 1400px;
            width: 100%;
            margin: 1.5rem auto 0;
            padding: 0 2rem;
            gap: 2.5rem;
        }

        aside {
            width: 260px;
            position: sticky;
            top: 100px;
            height: calc(100vh - 140px);
            background: var(--sidebar-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--border);
            border-radius: 24px;
            padding: 1.5rem 0.8rem;
            display: flex;
            flex-direction: column;
            gap: 0.3rem;
            flex-shrink: 0;
        }

        aside h2 {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.15em;
            color: #4b5563;
            margin-bottom: 0.8rem;
            padding-left: 1rem;
            font-weight: 700;
        }

        .nav-link {
            display: flex;
            align-items: center;
            gap: 0.8rem;
            padding: 0.75rem 1rem;
            color: var(--text-muted);
            text-decoration: none;
            border-radius: 14px;
            font-size: 0.95rem;
            font-weight: 500;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .nav-link i {
            width: 20px;
            font-size: 1.1rem;
            text-align: center;
            opacity: 0.8;
        }

        .nav-link:hover, .nav-link.active {
            background: rgba(255, 255, 255, 0.05);
            color: var(--text-main);
        }

        .nav-link.active {
            background: rgba(16, 185, 129, 0.1);
            color: #34d399;
            font-weight: 600;
            border-left: 3px solid var(--accent);
        }

        main {
            flex: 1;
            min-width: 0;
        }

        header {
            margin-bottom: 2.5rem;
        }

        header h1 {
            font-size: 2.6rem;
            font-weight: 800;
            letter-spacing: -0.03em;
            background: linear-gradient(135deg, #ffffff 40%, #a7f3d0 100%);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            line-height: 1.2;
        }

        header p {
            color: var(--text-muted);
            font-size: 1.1rem;
            margin-top: 0.5rem;
        }

        .content-card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 24px;
            padding: 2.5rem;
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            line-height: 1.8;
        }

        .content-card h2 {
            font-size: 1.4rem;
            font-weight: 700;
            margin: 2rem 0 1rem 0;
            color: var(--text-main);
            display: flex;
            align-items: center;
            gap: 0.6rem;
        }

        .content-card h2::before {
            content: '';
            width: 4px;
            height: 18px;
            background: var(--accent-gradient);
            border-radius: 2px;
        }

        .content-card p {
            color: #d1d5db;
            font-size: 1rem;
            margin-bottom: 1.2rem;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1.5rem;
            margin-bottom: 1.5rem;
        }
        @media (max-width: 640px) {
            .form-grid { grid-template-columns: 1fr; }
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .form-label {
            font-size: 0.9rem;
            font-weight: 600;
            color: var(--text-main);
        }

        .form-input {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 0.75rem 1rem;
            color: #fff;
            font-family: inherit;
            font-size: 0.95rem;
            transition: all 0.3s;
        }

        .form-input:focus {
            outline: none;
            border-color: var(--accent);
            background: rgba(255, 255, 255, 0.06);
        }

        .btn-submit {
            background: var(--accent-gradient);
            color: #fff;
            border: none;
            padding: 0.8rem 2rem;
            font-weight: 600;
            border-radius: 12px;
            cursor: pointer;
            font-family: inherit;
            transition: all 0.3s;
            box-shadow: 0 4px 12px var(--accent-glow);
        }

        .btn-submit:hover {
            opacity: 0.9;
            transform: translateY(-1px);
        }

        footer {
            border-top: 1px solid var(--border);
            text-align: center;
            padding: 3rem 1rem;
            margin-top: 5rem;
            background: rgba(9, 13, 22, 0.5);
            backdrop-filter: blur(16px);
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        footer p { margin-bottom: 0.8rem; }
        footer a { color: var(--text-muted); text-decoration: none; transition: color 0.2s; margin: 0 0.5rem; }
        footer a:hover { color: #34d399; }

        @media (max-width: 1024px) {
            .layout-wrapper { flex-direction: column; padding: 0 1.2rem; gap: 1.5rem; }
            aside { width: calc(100% + 2.4rem); margin-left: -1.2rem; height: auto; position: sticky; top: 57px; flex-direction: row; overflow-x: auto; padding: 0.6rem 1.2rem; border-radius: 0; background: rgba(9, 13, 22, 0.9); z-index: 100; }
            aside h2 { display: none; }
            .nav-link { display: inline-flex; padding: 0.5rem 1rem; white-space: nowrap; }
        }
    </style>
</head>
<body>
<div class="top-glow-bar"></div>
<div class="lang-bar">
    <button class="lang-btn">简体中文</button>
</div>
<div class="layout-wrapper">
    <aside>

        <a href="image.html" class="nav-link"><i class="fa-regular fa-image"></i><span>图片处理转换</span></a>
        <a href="network.html" class="nav-link"><i class="fa-solid fa-network-wired"></i><span>网络测试工具</span></a>
    </aside>
    <main>
        <header>
            <h1>联系我们</h1>
            <p>提出您的宝贵建议，或向我们提交新工具的定制需求。</p>
        </header>
        <div class="content-card">
            <h2>意见反馈与商务合作</h2>
            <p>如果您在使用工具的过程中发现了任何故障、代码漏洞、计算错误，或者您有绝佳的创意想法希望我们帮您排期开发，欢迎随时通过以下官方渠道与团队取得联系：</p>
            <p style="font-size: 1.2rem; font-weight: 700; color: #10b981; margin-bottom: 2rem;">
                <i class="fa-regular fa-envelope"></i> <a href="mailto:nongyun8@gmail.com" style="color: inherit; text-decoration: none;">nongyun8@gmail.com</a>
            </p>

            <h2>在线留言板</h2>
            <form onsubmit="event.preventDefault(); alert('感谢您的反馈！我们已收到您的留言，会尽快进行评估。');">
                <div class="form-grid">
                    <div class="form-group">
                        <label class="form-label">您的称呼</label>
                        <input type="text" class="form-input" placeholder="例如：张先生 / 开发者" required>
                    </div>
                    <div class="form-group">
                        <label class="form-label">电子邮箱</label>
                        <input type="email" class="form-input" placeholder="example@mail.com" required>
                    </div>
                </div>
                <div class="form-group" style="margin-bottom: 1.5rem;">
                    <label class="form-label">反馈或需求内容</label>
                    <textarea class="form-input" rows="5" placeholder="请详细描述您遇到的问题、改进意见或新工具开发提议..." required></textarea>
                </div>
                <button type="submit" class="btn-submit">提交反馈</button>
            </form>
        </div>
    </main>
</div>
<footer>
    <p>© 2026 万能在线工具箱 DevTools Box. 保留所有权利。</p>

        <a href="about.html">关于我们</a> |

    </p>
</footer>
</body>
</html>
