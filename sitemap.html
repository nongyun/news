<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <meta name="google-adsense-account" content="ca-pub-1624261597740761">

    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧰</text></svg>">
    
    <title id="page-title">Sitemap & Robots Optimizer – Ultimate Online Toolbox</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-1624261597740761" crossorigin="anonymous"></script>
    <script>
         (adsbygoogle = window.adsbygoogle || []).push({
              google_ad_client: "ca-pub-1624261597740761",
              enable_page_level_ads: true
         });
    </script>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-font-smoothing: antialiased; }
        
        :root {
            --bg-gradient: radial-gradient(circle at 10% 30%, #eef2f9 0%, #e0e8f2 100%);
            --text-main: #0b2b3b;
            --text-muted: #5c7285;
            --text-sub: #8fa0b0;
            --accent: #10b981;
            --accent-hover: #059669;
            --card-bg: #ffffff;
            --card-border: #bfd6ea;
            --shadow-sm: 0 4px 12px rgba(0,0,0,0.03);
            --shadow-md: 0 25px 45px -12px rgba(0,0,0,0.08);
            --radius-lg: 24px;
            --radius-md: 16px;
            --select-bg: #ffffff; /* 浅色模式下拉菜单背景 */
        }

        [data-theme="dark"] {
            --bg-gradient: radial-gradient(circle at 50% 0%, #111827 0%, #030712 100%);
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
            --text-sub: #6b7280;
            --accent: #10b981;
            --accent-hover: #059669;
            --card-bg: rgba(17, 24, 39, 0.75);
            --card-border: rgba(16, 185, 129, 0.15);
            --shadow-sm: 0 4px 12px rgba(0,0,0,0.3);
            --shadow-md: 0 25px 50px -12px rgba(0,0,0,0.5);
            --select-bg: #1f2937; /* 深色模式下拉菜单及选项的纯正黑夜背景色 */
        }

        body {
            font-family: 'Inter', -apple-system, sans-serif;
            background: var(--bg-gradient);
            color: var(--text-main);
            min-height: 100vh;
            padding: 40px 24px;
            display: flex;
            flex-direction: column;
            align-items: center;
            transition: background 0.3s ease, color 0.3s ease;
        }

        .container { width: 100%; max-width: 1000px; }
        
        .top-bar { width: 100%; display: flex; justify-content: space-between; align-items: center; margin-bottom: 32px; gap: 12px; flex-wrap: wrap; }
        .left-controls { display: flex; gap: 12px; align-items: center; }
        
        .back-btn, .theme-btn { background: var(--card-bg); border: 1px solid var(--card-border); color: var(--text-main); padding: 8px 18px; border-radius: 100px; font-size: 0.9rem; font-weight: 500; cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; gap: 8px; transition: all 0.2s ease; }
        .back-btn:hover, .theme-btn:hover { border-color: var(--accent); transform: translateY(-1px); }

        .lang-selector-container { display: flex; gap: 8px; }
        .lang-btn {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            color: var(--text-muted);
            padding: 6px 14px;
            border-radius: 100px;
            font-size: 0.85rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .lang-btn:hover, .lang-btn.active {
            background: var(--accent);
            color: #ffffff;
            border-color: var(--accent);
            box-shadow: 0 0 12px rgba(16, 185, 129, 0.4);
        }

        header { text-align: center; margin-bottom: 40px; }
        header h1 { font-size: 2.5rem; font-weight: 800; letter-spacing: -1px; margin-bottom: 12px; color: var(--text-main); }
        header p { color: var(--text-muted); font-size: 1.05rem; max-width: 600px; margin: 0 auto; line-height: 1.5; }

        .workspace { background: var(--card-bg); border: 1px solid var(--card-border); border-radius: var(--radius-lg); padding: 32px; box-shadow: var(--shadow-md); display: flex; flex-direction: column; gap: 24px; margin-bottom: 32px; }
        
        .input-group { display: flex; flex-direction: column; gap: 8px; }
        .input-group label { font-size: 0.95rem; font-weight: 600; color: var(--text-main); display: flex; align-items: center; gap: 6px; }
        
        /* 优化后的输入组件和选择框统一样式库 */
        .input-group input, .input-group textarea, .input-group select { 
            background: rgba(0,0,0,0.02); 
            border: 1px solid var(--card-border); 
            border-radius: var(--radius-md); 
            padding: 14px; 
            font-family: inherit; 
            font-size: 0.95rem; 
            color: var(--text-main); 
            outline: none; 
            transition: border-color 0.2s, background 0.2s, color 0.2s; 
            -webkit-appearance: none; 
            -moz-appearance: none;
            appearance: none;
        }

        /* 针对 Select 元素增加高雅的手风琴倒三角箭头支持 */
        .input-group select {
            background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='24' height='24' viewBox='0 0 24 24' fill='none' stroke='%2310b981' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><polyline points='6 9 12 15 18 9'></polyline></svg>");
            background-repeat: no-repeat;
            background-position: right 14px center;
            background-size: 16px;
            padding-right: 40px; /* 避免文字与箭头重叠 */
        }

        [data-theme="dark"] .input-group input, 
        [data-theme="dark"] .input-group textarea { 
            background: rgba(255,255,255,0.02); 
        }

        /* 🛠️ 核心修复：强制重塑 Select 和 Option 标签在深色架构下的色彩表现 */
        [data-theme="dark"] .input-group select {
            background-color: var(--select-bg);
            color: var(--text-main);
        }
        .input-group select option {
            background-color: var(--select-bg);
            color: var(--text-main);
        }

        .input-group input:focus, .input-group textarea:focus, .input-group select:focus { border-color: var(--accent); }
        
        .config-row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }

        .btn-primary { background: var(--accent); color: #ffffff; border: none; padding: 14px; border-radius: var(--radius-md); font-size: 1rem; font-weight: 600; cursor: pointer; transition: background 0.2s, transform 0.2s; display: flex; align-items: center; justify-content: center; gap: 8px; box-shadow: 0 4px 12px rgba(16,185,129,0.2); }
        .btn-primary:hover { background: var(--accent-hover); transform: translateY(-1px); }

        .result-zone { display: none; grid-template-columns: 1fr; gap: 24px; animation: fadeIn 0.4s ease forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .output-card { background: var(--card-bg); border: 1px solid var(--card-border); border-radius: var(--radius-md); padding: 20px; display: flex; flex-direction: column; gap: 12px; }
        .output-header { display: flex; justify-content: space-between; align-items: center; }
        .output-header h3 { font-size: 1.05rem; font-weight: 700; display: flex; align-items: center; gap: 8px; }
        .badge-count { background: rgba(16,185,129,0.1); color: var(--accent); padding: 2px 10px; border-radius: 100px; font-size: 0.78rem; font-weight: 700; }
        
        .action-btns { display: flex; gap: 8px; }
        .btn-action { background: rgba(0,0,0,0.04); border: 1px solid var(--card-border); color: var(--text-main); padding: 6px 12px; border-radius: 8px; font-size: 0.82rem; font-weight: 600; cursor: pointer; display: inline-flex; align-items: center; gap: 4px; transition: all 0.2s; }
        [data-theme="dark"] .btn-action { background: rgba(255,255,255,0.04); }
        .btn-action:hover { border-color: var(--accent); background: var(--accent); color: #ffffff; }

        pre { background: rgba(0,0,0,0.03); border: 1px solid var(--card-border); border-radius: 10px; padding: 14px; font-family: 'Courier New', Courier, monospace; font-size: 0.88rem; overflow-x: auto; max-height: 260px; color: var(--text-main); white-space: pre-wrap; word-break: break-all; }
        [data-theme="dark"] pre { background: rgba(255,255,255,0.03); }

        .ad-wrapper { margin: 24px auto; width: 100%; text-align: center; }
        
        .toast { position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%) translateY(40px); background: #10b981; color: #ffffff; padding: 10px 24px; border-radius: 100px; font-size: 0.9rem; font-weight: 600; box-shadow: 0 10px 25px rgba(16,185,129,0.3); opacity: 0; pointer-events: none; transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275), opacity 0.3s; z-index: 9999; display: flex; align-items: center; gap: 8px; }
        .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

        @media (max-width: 768px) {
            .top-bar { flex-direction: column; align-items: flex-start; }
            .lang-selector-container { width: 100%; justify-content: flex-start; margin-top: 4px; }
            .config-row { grid-template-columns: 1fr; }
            .workspace { padding: 20px; }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="top-bar">
        <div class="left-controls">
            <a href="index.html" class="back-btn"><i class="fas fa-arrow-left"></i> <span class="i18n" data-en="Back" data-zh="返回工具箱" data-es="Atrás" data-ja="戻る">Back</span></a>
            <button class="theme-btn" onclick="toggleTheme()"><i class="fas fa-lightbulb"></i> Theme</button>
        </div>
        <div class="lang-selector-container">
            <button class="lang-btn" id="lang-en" onclick="switchLang('en')">English</button>
            <button class="lang-btn" id="lang-zh" onclick="switchLang('zh')">简体中文</button>
            <button class="lang-btn" id="lang-es" onclick="switchLang('es')">Español</button>
            <button class="lang-btn" id="lang-ja" onclick="switchLang('ja')">日本語</button>
        </div>
    </div>

    <header>
        <h1 id="txt-title" class="i18n" data-en="Sitemap & Robots Optimizer" data-zh="Sitemap & Robots 深度优化器" data-es="Optimizador de Sitemap y Robots" data-ja="Sitemap & Robots 統合最適化ツール">Sitemap & Robots Optimizer</h1>
        <p class="i18n" data-en="Extract web links from raw HTML or text content to dynamically build structured index maps locally." data-zh="粘贴网页 HTML 源代码或任意包含链接的文本，本地智能提取并自动打包构建规范的 XML 映射文件与爬虫控制策略。" data-es="Extraiga enlaces web de código HTML para compilar mapas XML de motores de búsqueda de forma nativa." data-ja="HTMLソースコードやテキストからリンクを自动で抽出し、検索エンジンに最適化されたXMLサイトマップを作成します。">Extract web links from raw HTML or text content to dynamically build structured index maps locally.</p>
    </header>

    <div class="workspace">
        <div class="input-group">
            <label class="i18n" data-en="Target Website Domain URL (With www or prefix)" data-zh="目标网站根域名 URL（建议包含协议头与前缀）" data-es="URL del Dominio Base" data-ja="対象サイトのルートURL">Target Website Domain URL</label>
            <input type="url" id="domainInput" placeholder="https://www.yourdomain.com" value="https://www.yourdomain.com">
        </div>

        <div class="config-row">
            <div class="input-group">
                <label class="i18n" data-en="Update Frequency (changefreq)" data-zh="更新频率 (changefreq)" data-es="Frecuencia de actualización" data-ja="更新頻度 (changefreq)">Update Frequency</label>
                <select id="freqInput">
                    <option value="always">always</option>
                    <option value="hourly">hourly</option>
                    <option value="daily" selected>daily</option>
                    <option value="weekly">weekly</option>
                    <option value="monthly">monthly</option>
                    <option value="yearly">yearly</option>
                    <option value="never">never</option>
                </select>
            </div>
            <div class="input-group">
                <label class="i18n" data-en="Default Priority (0.0 - 1.0)" data-zh="默认权重 (priority)" data-es="Prioridad predeterminada" data-ja="デフォルト優先度 (0.0 - 1.0)">Default Priority</label>
                <select id="priorityInput">
                    <option value="1.0">1.0 (Highest)</option>
                    <option value="0.9">0.9</option>
                    <option value="0.8" selected>0.8 (Default)</option>
                    <option value="0.7">0.7</option>
                    <option value="0.6">0.6</option>
                    <option value="0.5">0.5 (Neutral)</option>
                    <option value="0.4">0.4</option>
                    <option value="0.3">0.3</option>
                    <option value="0.2">0.2</option>
                    <option value="0.1">0.1</option>
                </select>
            </div>
        </div>

        <div class="input-group">
            <label class="i18n" data-en="Paste Web HTML Code or Raw Text" data-zh="粘贴网页 HTML 源代码或原始混杂文本内容" data-es="Pegar código HTML de la página web" data-ja="ウェブページのHTMLソースコードまたはテキストを貼り付け">Paste Web HTML Code or Raw Text</label>
            <textarea id="htmlInput" rows="8" placeholder="<a href='/page1.html'>Link 1</a>&#10;<a href='https://www.yourdomain.com/about'>Link 2</a>&#10;..."></textarea>
        </div>

        <button class="btn-primary" id="generateBtn">
            <i class="fas fa-wand-magic-sparkles"></i>
            <span class="i18n" data-en="Extract & Generate Map" data-zh="提取并智能生成" data-es="Extraer y Generar" data-ja="リンク抽出・サイトマップ生成">Extract & Generate Map</span>
        </button>
    </div>

    <div class="ad-wrapper">
        <ins class="adsbygoogle" style="display:block" data-ad-client="ca-pub-1624261597740761" data-ad-slot="7441222926" data-ad-format="auto" data-full-width-responsive="true"></ins>
        <script>(adsbygoogle = window.adsbygoogle || []).push({});</script>
    </div>

    <div class="result-zone" id="resultDiv">
        <div class="output-card">
            <div class="output-header">
                <h3><i class="fas fa-code" style="color: #10b981;"></i> sitemap.xml <span class="badge-count" id="badge-sm-count">0 URLs</span></h3>
                <div class="action-btns">
                    <button class="btn-action" onclick="copyCode('sitemapOutput')"><i class="fas fa-copy"></i> <span class="i18n" data-en="Copy" data-zh="复制" data-es="Copiar" data-ja="コピー">Copy</span></button>
                    <button class="btn-action" onclick="downloadFile('sitemapOutput', 'sitemap.xml')"><i class="fas fa-download"></i> <span class="i18n" data-en="Download" data-zh="下载" data-es="Descargar" data-ja="ダウンロード">Download</span></button>
                </div>
            </div>
            <pre id="sitemapOutput"></pre>
        </div>

        <div class="output-card">
            <div class="output-header">
                <h3><i class="fas fa-robot" style="color: #3b82f6;"></i> robots.txt</h3>
                <div class="action-btns">
                    <button class="btn-action" onclick="copyCode('robotsOutput')"><i class="fas fa-copy"></i> <span class="i18n" data-en="Copy" data-zh="复制" data-es="Copiar" data-ja="コピー">Copy</span></button>
                    <button class="btn-action" onclick="downloadFile('robotsOutput', 'robots.txt')"><i class="fas fa-download"></i> <span class="i18n" data-en="Download" data-zh="下载" data-es="Descargar" data-ja="ダウンロード">Download</span></button>
                </div>
            </div>
            <pre id="robotsOutput"></pre>
        </div>
    </div>
</div>

<div class="toast" id="toastBox"><i class="fas fa-check-circle"></i> <span id="toastMsg"></span></div>

<script>
    let currentLang = 'en';

    const SM_LANGS = {
        en: { suc: "Sitemap generated successfully!", copy: "Copied to clipboard!", err: "Please paste text containing valid links first." },
        zh: { suc: "站点地图及指引策略生成成功！", copy: "已成功复制到剪贴板！", err: "请先粘贴包含有效链接的 HTML 或文本内容。" },
        es: { suc: "¡Sitemap generado con éxito!", copy: "¡Copiado al portapapeles!", err: "Por favor, pegue texto con enlaces válidos primero." },
        ja: { suc: "サイトマップが正常に作成されました！", copy: "クリップボードにコピーしました！", err: "有効なリンクを含むテキストを入力してください。" }
    };

    function switchLang(lang) {
        currentLang = lang;
        
        const titleMap = { en: "Sitemap & Robots Optimizer", zh: "Sitemap & Robots 深度优化器", es: "Optimizador de Sitemap y Robots", ja: "Sitemap & Robots 統合最適化ツール" };
        document.title = (titleMap[lang] || titleMap['en']) + " – Ultimate Online Toolbox";
        
        document.querySelectorAll('.i18n').forEach(el => {
            const translation = el.getAttribute(`data-${lang}`);
            if (translation) el.innerHTML = translation;
        });

        document.querySelectorAll('.lang-btn').forEach(b => b.classList.remove('active'));
        const activeBtn = document.getElementById(`lang-${lang}`);
        if(activeBtn) activeBtn.classList.add('active');

        localStorage.setItem('user_lang_preference', lang);
        document.documentElement.lang = lang;
    }

    function toggleTheme() {
        const currentTheme = document.documentElement.getAttribute('data-theme');
        const targetTheme = currentTheme === 'dark' ? 'light' : 'dark';
        document.documentElement.setAttribute('data-theme', targetTheme);
        localStorage.setItem('user_theme_preference', targetTheme);
    }

    function initTheme() {
        const savedTheme = localStorage.getItem('user_theme_preference') || 'dark';
        document.documentElement.setAttribute('data-theme', savedTheme);
    }

    function showToast(msg) {
        const toast = document.getElementById('toastBox');
        document.getElementById('toastMsg').innerText = msg;
        toast.classList.add('show');
        setTimeout(() => toast.classList.remove('show'), 2500);
    }

    document.getElementById('generateBtn').addEventListener('click', () => {
        let domain = document.getElementById('domainInput').value.trim();
        const htmlContent = document.getElementById('htmlInput').value;
        const freq = document.getElementById('freqInput').value;
        const priority = document.getElementById('priorityInput').value;

        if (!htmlContent.trim()) {
            showToast(SM_LANGS[currentLang].err);
            return;
        }

        if (domain && !domain.startsWith('http://') && !domain.startsWith('https://')) {
            domain = 'https://' + domain;
        }
        if (domain.endsWith('/')) {
            domain = domain.slice(0, -1);
        }

        const hrefRegex = /href=["']([^"']+)["']/g;
        let match;
        const extractedUrls = [];

        while ((match = hrefRegex.exec(htmlContent)) !== null) {
            let url = match[1].trim();

            if (!url || url.startsWith('#') || url.startsWith('javascript:') || url.startsWith('mailto:') || url.startsWith('tel:')) {
                continue;
            }

            if (url.startsWith('/')) {
                url = domain + url;
            } else if (!url.startsWith('http://') && !url.startsWith('https://')) {
                url = domain + '/' + url;
            }

            if (url.includes('#')) {
                url = url.split('#')[0];
            }

            extractedUrls.push(url);
        }

        if (extractedUrls.length === 0) {
            const rawUrlRegex = /(https?:\/\/[^\s"'><]+)/g;
            let rawMatch;
            while ((rawMatch = rawUrlRegex.exec(htmlContent)) !== null) {
                extractedUrls.push(rawMatch[1].trim());
            }
        }

        const uniqueUrls = [...new Set(extractedUrls)];

        if (uniqueUrls.length === 0 && domain) {
            uniqueUrls.push(domain + '/');
        }

        const today = new Date().toISOString().split('T')[0];

        let xml = '<?xml version="1.0" encoding="UTF-8"?>\n';
        xml += '<urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">\n';
        
        uniqueUrls.forEach(link => {
            xml += '  <url>\n';
            xml += `    <loc>${escapeXml(link)}</loc>\n`;
            xml += `    <lastmod>${today}</lastmod>\n`;
            xml += `    <changefreq>${freq}</changefreq>\n`;
            xml += `    <priority>${priority}</priority>\n`;
            xml += '  </url>\n';
        });
        xml += '</urlset>';

        let robots = 'User-agent: *\n';
        robots += 'Allow: /\n';
        robots += `Sitemap: ${domain}/sitemap.xml`;

        document.getElementById('sitemapOutput').innerText = xml;
        document.getElementById('robotsOutput').innerText = robots;
        document.getElementById('badge-sm-count').innerText = `${uniqueUrls.length} URLs`;
        document.getElementById('resultDiv').style.display = 'grid';
        showToast(SM_LANGS[currentLang].suc);
    });

    function escapeXml(string) {
        return string.replace(/[<>&'"]/g, (c) => {
            switch (c) {
                case '<': return '&lt;';
                case '>': return '&gt;';
                case '&': return '&amp;';
                case '\'': return '&apos;';
                case '"': return '&quot;';
            }
        });
    }

    function copyCode(id) {
        const text = document.getElementById(id).innerText;
        navigator.clipboard.writeText(text).then(() => {
            showToast(SM_LANGS[currentLang].copy);
        });
    }

    function downloadFile(id, filename) {
        const text = document.getElementById(id).innerText;
        const blob = new Blob([text], {type: 'text/plain'});
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = filename;
        a.click();
    }

    window.addEventListener('DOMContentLoaded', () => {
        initTheme();
        const storedPreference = localStorage.getItem('user_lang_preference') || 'en';
        switchLang(storedPreference);
    });
</script>
</body>
</html>
