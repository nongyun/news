    } };
    const unitTool = { id:'unit', nameKey:'unit', icon:'fas fa-ruler', get name(){return t(this.nameKey);}, render:c=>{
        c.innerHTML=`<h2><i class="fas fa-ruler-combined"></i> ${t('unit')}</h2><div class="card-result"><div class="control-bar"><div class="ctrl-group"><label>类型</label><select id="unitType"><option value="length">${t('length')}</option><option value="weight">${t('weight')}</option><option value="temperature">${t('temperature')}</option><option value="area">${t('area')}</option><option value="volume">${t('volume')}</option></select></div><div class="ctrl-group"><label>从</label><select id="fromUnit"></select></div><div class="ctrl-group"><label>到</label><select id="toUnit"></select></div><div class="ctrl-group"><label>数值</label><input id="unitValue" type="number" value="1"></div><button id="convertUnit" class="btn btn-primary">转换</button></div><div id="unitResult" style="margin-top:1rem;font-weight:600;">--</div></div>`;
        const unitDefs = { length: { units: ["m","km","mile","ft","cm","mm"], names: {m:t('meter'), km:t('km'), mile:t('mile'), ft:t('foot'), cm:t('cm'), mm:t('mm')}, convert: (val,from,to)=> { const toMeter={m:1, km:1000, mile:1609.34, ft:0.3048, cm:0.01, mm:0.001}; return val * toMeter[from] / toMeter[to]; } }, weight: { units: ["kg","g","lb","oz"], names: {kg:t('kg'), g:t('gram'), lb:t('pound'), oz:t('ounce')}, convert: (val,from,to)=> { const toGram={kg:1000, g:1, lb:453.592, oz:28.3495}; return val * toGram[from] / toGram[to]; } }, temperature: { units: ["c","f"], names: {c:t('celsius'), f:t('fahrenheit')}, convert: (val,from,to)=> { if(from===to) return val; if(from==="c" && to==="f") return val*9/5+32; if(from==="f" && to==="c") return (val-32)*5/9; return val; } }, area: { units: ["m2","ft2","cm2"], names: {m2:t('sqm'), ft2:t('sqft'), cm2:t('sqcm')}, convert: (val,from,to)=> { const toM2={m2:1, ft2:0.092903, cm2:0.0001}; return val * toM2[from] / toM2[to]; } }, volume: { units: ["l","gal","ml"], names: {l:t('liter'), gal:t('gallon'), ml:t('ml')}, convert: (val,from,to)=> { const toLiter={l:1, gal:3.78541, ml:0.001}; return val * toLiter[from] / toLiter[to]; } } };
        const typeSel=c.querySelector('#unitType'), fromSel=c.querySelector('#fromUnit'), toSel=c.querySelector('#toUnit'), valInp=c.querySelector('#unitValue'), convBtn=c.querySelector('#convertUnit'), resDiv=c.querySelector('#unitResult');
        function populateUnits(){ let type=typeSel.value; let def=unitDefs[type]; fromSel.innerHTML=""; toSel.innerHTML=""; def.units.forEach(u=>{ let opt=document.createElement('option'); opt.value=u; opt.innerText=def.names[u]||u; fromSel.appendChild(opt.cloneNode(true)); toSel.appendChild(opt); }); if(type==="temperature"){ fromSel.value="c"; toSel.value="f";} else { fromSel.value=def.units[0]; toSel.value=def.units[1];} }
        function convert(){ let type=typeSel.value; let def=unitDefs[type]; let val=parseFloat(valInp.value)||0; let from=fromSel.value, to=toSel.value; let result=def.convert(val,from,to); resDiv.innerHTML=`${val} ${def.names[from]} = ${result.toFixed(4)} ${def.names[to]}`; }
        typeSel.addEventListener('change',()=>{populateUnits();convert();}); convBtn.addEventListener('click',convert); populateUnits(); convert();
    } };
    const tools = [compressTool, watermarkTool, formatExtTool, convertTool, uuidTool, officeTool, qrTool, relationTool, loanTool, currencyTool, unitTool];
    let activeId = 'compress';
    function renderSidebar(){ const sidebar=document.getElementById('toolsSidebar'); sidebar.innerHTML=''; tools.forEach(t=>{ const btn=document.createElement('button'); btn.className=`tool-tab ${activeId===t.id?'active':''}`; btn.innerHTML=`<i class="${t.icon}"></i> <span>${t.name}</span>`; btn.addEventListener('click',()=>{ activeId=t.id; renderSidebar(); renderActive(); }); sidebar.appendChild(btn); }); }
    function renderActive(){ const container=document.getElementById('activeToolRender'); if(!container)return; const tool=tools.find(t=>t.id===activeId); if(tool&&tool.render){ container.innerHTML=''; tool.render(container); } }
    document.getElementById('languageSwitch').addEventListener('change',(e)=>{ currentLang=e.target.value; updateUI(); renderSidebar(); renderActive(); });
    renderSidebar(); renderActive(); window._refreshAll=()=>{ renderSidebar(); renderActive(); };
</script>
</body>
</html>
