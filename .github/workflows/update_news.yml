name: 🕒 每日新闻自动更新

on:
  schedule:
    # 北京时间 8:00 运行（UTC 时间 0:00），根据需求调整
    - cron: '0 0 * * *'
  workflow_dispatch: # 允许手动触发

jobs:
  update-news:
    runs-on: ubuntu-latest
    # 声明权限：让 GitHub Action 有权限将生成的新文件推送到你的仓库
    permissions:
      contents: write

    steps:
      - name: 📥 拉取代码
        uses: actions/checkout@v4

      - name: 🐍 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 📦 安装依赖
        run: pip install -r requirements.txt

      - name: 🚀 执行新闻采集脚本
        env:
          # 如有 API Key，通过 GitHub Secrets 安全传递
          NEWS_API_KEY: ${{ secrets.NEWS_API_KEY }}
        run: |
          python scripts/fetch_news.py

      - name: 🌐 生成静态网站
        run: |
          python build_news_site.py

      - name: 🔄 提交更新
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Auto update: news data and site [skip ci]" || echo "No changes"
          git push
