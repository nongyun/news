            padding: 40px 24px;
            display: flex;
            flex-direction: column;
            align-items: center;
            transition: background 0.3s ease, color 0.3s ease;

            width: 100%;
            max-width: 850px;
        }

            justify-content: space-between;

        .back-btn:hover, .theme-btn:hover {
            background: var(--item-bg);
            border-color: var(--accent);
            transform: translateY(-1px);
        }

        .lang-selector-container { display: flex; gap: 6px; }
        .lang-btn {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            color: var(--color-muted);
            padding: 6px 14px;
            border-radius: 100px;
            font-size: 0.85rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .lang-btn:hover, .lang-btn.active {
            background: var(--accent);
            color: #ffffff;
            border-color: var(--accent);
            box-shadow: 0 4px 12px rgba(59, 130, 246, 0.3);
        }

            font-size: 2.2rem;
            font-weight: 800;
            color: var(--color-title);
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;

            border: 1px solid var(--card-border);
            border-radius: 1.5rem;
            padding: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.03);
            text-align: center;
            backdrop-filter: blur(10px);

            margin-bottom: 8px;
            font-weight: 600;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 4px;

            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 2rem;
            padding: 36px;
            box-shadow: var(--shadow-md);
            backdrop-filter: blur(10px);
            transition: background 0.3s ease, border-color 0.3s ease;
        }

        /* 标签导航卡 */

            display: flex;
            gap: 12px;
            margin-bottom: 28px;
            border-bottom: 1px solid var(--item-border);
            padding-bottom: 12px;

            background: none;
            border: none;
            color: var(--color-muted);
            font-size: 1.05rem;
            font-weight: 600;
            padding: 8px 16px;
            cursor: pointer;
            position: relative;
            transition: color 0.2s ease;
        }
        .tab-btn.active { color: var(--accent); }
        .tab-btn.active::after {
            content: '';
            position: absolute;
            bottom: -13px;
            left: 0;
            width: 100%;
            height: 3px;
            background: var(--accent);
            border-radius: 100px;
        }

        .tab-content { display: none; animation: fadeIn 0.3s ease-out forwards; }
        .tab-content.active { display: block; }

        /* 表单群组排版 */
        .control-group { display: flex; flex-direction: column; gap: 8px; margin-bottom: 20px; }
        .control-group label { font-size: 0.9rem; font-weight: 600; color: var(--color-muted); }
        
        .styled-input, .styled-select {
            width: 100%;
            background: var(--input-bg);
            border: 1px solid var(--card-border);
            color: var(--color-main);
            padding: 14px 18px;
            border-radius: 12px;
            font-size: 1rem;
            outline: none;
            transition: all 0.2s;
        }
        .styled-input:focus, .styled-select:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.15);
        }
        .styled-select { cursor: pointer; }

        /* 企业专属级联动区域容器动画 */
        .enterprise-zone {
            display: none;
            border-left: 3px solid var(--accent);
            padding-left: 14px;
            margin-bottom: 10px;
            animation: fadeIn 0.3s ease-out forwards;
        }

        /* 按钮与画布的双列对齐网格 */
        .panel-split {
            display: grid;
            grid-template-columns: 1fr 220px;
            gap: 28px;
            align-items: start;
        }

        .form-side { display: flex; flex-direction: column; }

        .preview-side {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
        }
        
        .qr-box {
            width: 220px;
            height: 220px;
            background: #ffffff; /* 确保二维码白底可被扫描 */
            border: 1px solid var(--item-border);
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 12px;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.02);

        .qr-box img { max-width: 100%; max-height: 100%; }

        .calc-action-btn {
            background: var(--accent-gradient);
            border: none;
            color: #ffffff;
            padding: 14px 24px;
            border-radius: 12px;
            font-size: 1rem;

            align-items: center;
            justify-content: center;
            gap: 8px;
            box-shadow: 0 4px 14px rgba(37, 99, 235, 0.2);

        .calc-action-btn:hover {
            transform: translateY(-1px);
            box-shadow: 0 6px 18px rgba(37, 99, 235, 0.3);

        .download-btn {

            box-shadow: 0 4px 14px rgba(16, 185, 129, 0.2);
        }
        .download-btn:hover {
            box-shadow: 0 6px 18px rgba(16, 185, 129, 0.3);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(4px); }
            to { opacity: 1; transform: translateY(0); }

            text-align: center;
            margin-top: 48px;
            padding: 24px 0;
            border-top: 1px solid var(--card-border);

            color: var(--color-sub);

            .panel-split { grid-template-columns: 1fr; }
            .preview-side { order: -1; margin-bottom: 12px; }
            .top-bar { flex-direction: column; align-items: flex-start; }

</head>

        document.getElementById('tab-text').innerText = t.tabText;
        document.getElementById('tab-wifi').innerText = t.tabWifi;
        
        document.getElementById('lbl-text-input').innerText = t.lblTextInput;
        document.getElementById('textGenBtn').innerHTML = t.btnTextGen;
        document.getElementById('textDownloadBtn').innerHTML = t.btnTextDl;
        
        document.getElementById('lbl-wifi-ssid').innerText = t.lblWifiSsid;
        document.getElementById('lbl-wifi-enc').innerText = t.lblWifiEnc;
        document.getElementById('lbl-wifi-pwd').innerText = t.lblWifiPwd;
        document.getElementById('lbl-wifi-eap').innerText = t.lblWifiEap;
        document.getElementById('lbl-wifi-identity').innerText = t.lblWifiIdentity;
        document.getElementById('wifiGenBtn').innerHTML = t.btnWifiGen;
        document.getElementById('wifiDownloadBtn').innerHTML = t.btnWifiDl;
        
        document.querySelectorAll('.lbl-ad').forEach(el => el.innerHTML = t.ad);

        document.querySelectorAll('.lang-btn').forEach(b => b.classList.remove('active'));
        const activeBtn = document.getElementById(`lang-${lang}`);
        if(activeBtn) activeBtn.classList.add('active');

        localStorage.setItem('user_lang_preference', lang);
        document.documentElement.lang = lang;
    }

    function switchTab(panelId) {
        document.querySelectorAll('.tab-content').forEach(p => p.classList.remove('active'));
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        
        document.getElementById(panelId).classList.add('active');
        if (panelId === 'text-panel') {
            document.getElementById('tab-text').classList.add('active');
        } else {
            document.getElementById('tab-wifi').classList.add('active');
        }
    }

    function toggleTheme() {
        const currentTheme = document.documentElement.getAttribute('data-theme');
        const targetTheme = currentTheme === 'dark' ? 'light' : 'dark';
        document.documentElement.setAttribute('data-theme', targetTheme);
        localStorage.setItem('user_theme_preference', targetTheme);
    }

    function initTheme() {
        const savedTheme = localStorage.getItem('user_theme_preference') || 'dark';
        document.documentElement.setAttribute('data-theme', savedTheme);
    }

    // 联动表单交互逻辑处理
    function handleSecurityChange() {
        const enc = document.getElementById('wifiEnc').value;
        const entZone = document.getElementById('entZone');
        const pwdGroup = document.getElementById('pwdGroup');
        
        if (enc === 'WPA2-EAP') {
            entZone.style.display = 'block';
        } else {
            entZone.style.display = 'none';
        }

        if (enc === 'nopass') {
            pwdGroup.style.display = 'none';
        } else {
            pwdGroup.style.display = 'flex';
        }
    }

    // === 核心数据交互绑定逻辑机制 (0删减) ===
    let qr1 = null, qr2 = null;

    const textInput = document.getElementById('textInput');
    const textGenBtn = document.getElementById('textGenBtn');
    const textBox = document.getElementById('textBox');
    const textDownloadBtn = document.getElementById('textDownloadBtn');

    textGenBtn.addEventListener('click', () => {
        let val = textInput.value.trim();
        if (!val) { 
            alert(QR_LANGS[currentLang].alertTxtEmpty); 
            return; 
        }
        if (qr1) qr1.clear();
        textBox.innerHTML = '<div id="tmptext"></div>';
        qr1 = new QRCode(document.getElementById("tmptext"), { text: val, width: 200, height: 200 });
    });

    textDownloadBtn.addEventListener('click', () => {
        const canvas = textBox.querySelector('canvas');
        if (canvas) {
            const a = document.createElement('a');
            a.href = canvas.toDataURL();
            a.download = 'qrcode.png';
            a.click();
        } else {
            alert(QR_LANGS[currentLang].alertDl);
        }
    });

    const wifiSsid = document.getElementById('wifiSsid');
    const wifiEnc = document.getElementById('wifiEnc');
    const wifiEap = document.getElementById('wifiEap');
    const wifiIdentity = document.getElementById('wifiIdentity');
    const wifiPwd = document.getElementById('wifiPwd');
    const wifiGenBtn = document.getElementById('wifiGenBtn');
    const wifiBox = document.getElementById('wifiBox');
    const wifiDownloadBtn = document.getElementById('wifiDownloadBtn');

    wifiGenBtn.addEventListener('click', () => {
        let ssid = wifiSsid.value.trim();
        let enc = wifiEnc.value;
        let eap = wifiEap.value;
        let identity = wifiIdentity.value.trim();
        let pwd = wifiPwd.value;

        if (!ssid) { 
            alert(QR_LANGS[currentLang].alertSsid); 
            return; 
        }
        
        // 组装符合规范的 WiFi 字符串协议
        let str = "";
        if (enc === 'WPA2-EAP') {
            if (!identity) {
                alert(QR_LANGS[currentLang].alertIdentity);
                return;
            }
            if (!pwd) {
                alert(QR_LANGS[currentLang].alertPwd);
                return;
            }
            // 企业级标准：WIFI:S:SSID;T:WPA2-EAP;E:EAP_METHOD;I:IDENTITY;P:PASSWORD;;
            str = `WIFI:S:${ssid};T:WPA2-EAP;E:${eap};I:${identity};P:${pwd};;`;
        } else if (enc === 'nopass') {
            str = `WIFI:S:${ssid};T:nopass;;`;
        } else {
            if (!pwd) { 
                alert(QR_LANGS[currentLang].alertPwd); 
                return; 
            }
            // 支持标准的 WPA / WPA3 个人版或 WEP 
            str = `WIFI:S:${ssid};T:${enc};P:${pwd};;`;
        }

        if (qr2) qr2.clear();
        wifiBox.innerHTML = '<div id="tmpwifi"></div>';
        qr2 = new QRCode(document.getElementById("tmpwifi"), { text: str, width: 200, height: 200 });
    });

    wifiDownloadBtn.addEventListener('click', () => {
        const canvas = wifiBox.querySelector('canvas');
        if (canvas) {
            const a = document.createElement('a');
            a.href = canvas.toDataURL();
            a.download = 'wifi_qrcode.png';
            a.click();
        } else {
            alert(QR_LANGS[currentLang].alertDl);
        }
    });

    window.addEventListener('DOMContentLoaded', () => {
        initTheme(); 
        const storedPreference = localStorage.getItem('user_lang_preference') || 'en';
        switchLang(storedPreference);
        
        // 初始化运行演示触发生成
        textInput.value = "https://example.com";
        textGenBtn.click();
    });
</script>
</body>
</html>
