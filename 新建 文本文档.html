  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      margin: 0;
      padding: 0;
    }
    header {
      background: #4a90e2;
      color: white;
      padding: 20px;
      text-align: center;
    }
    .container {
      max-width: 900px;
      margin: 20px auto;
      background: white;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }
    h2 {
      border-bottom: 1px solid #ddd;
      padding-bottom: 5px;
    }
    .tool {
      margin: 10px 0;
      padding: 10px;
      border: 1px solid #eee;
      border-radius: 6px;
      background: #fafafa;
    }
  </style>
</head>
<body>
  <header>
    <h1>万能工具箱</h1>
    <p>一站式常用工具集合</p>
  </header>

  <div class="container">
    <h2>系统工具</h2>
    <div class="tool">定时关机</div>
    <div class="tool">硬件检测</div>
    <div class="tool">文件批量重命名</div>

    <h2>网络工具</h2>
    <div class="tool">网速测试</div>
    <div class="tool">IP 查询</div>
    <div class="tool">二维码生成</div>

    <h2>图片视频工具</h2>
    <div class="tool">图片压缩</div>
    <div class="tool">视频格式转换</div>
    <div class="tool">截图工具</div>
  </div>
