        .copy-btn:hover { color: #3b82f6; }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(4px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* 全局轻量弹窗通知 */
        .toast {
            position: fixed;
            bottom: 32px;
            left: 50%;
            transform: translateX(-50%) translateY(40px);
            background: #0b2b3b;
            color: #ffffff;

            z-index: 1000;
            pointer-events: none;
        }
        .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

        footer {

        @media (max-width: 600px) {

            .top-bar { flex-direction: column; align-items: flex-start; }
            .lang-selector-container { width: 100%; justify-content: flex-start; margin-top: 4px; }

<script>
    // 1. 国际化多语种字典配置
    const UUID_LANGS = {
        en: {

            desc: "Bulk generate secure random UUID v1 and v4 strings locally within your browser sandbox safely.",
            back: "<i class='fas fa-arrow-left'></i> Back to Hub",

            back: "<i class='fas fa-arrow-left'></i> 返回工具箱",
            version: "UUID 版本规格",
            count: "单次生成数量 (上限 50)",
            letterCase: "字母大小写格式",
            btnGen: "<i class='fas fa-bolt'></i> 立即批量生成",
            btnCopy: "<i class='fas fa-copy'></i> 复制全部结果",
            btnClear: "<i class='fas fa-trash-can'></i> 清空数据列表",
            outTitle: "已生成的密码学 UUID 列表",
            empty: "✨ 在上方设定参数并点击“立即批量生成”按钮",
            copied: "已成功复制该条 UUID",
            allCopied: "已成功复制全部 UUID 结果到剪贴板",
            ad: "<i class='fas fa-rectangle-ad'></i> 赞助商广告",
            toastGen: "✅ 成功生成 "
        },
        es: {
            title: "Generador de UUID",
            desc: "Genere en lote cadenas aleatorias seguras de UUID v1 y v4 localmente en su navegador de forma segura.",
            back: "<i class='fas fa-arrow-left'></i> Volver al menú",
            version: "Versión de UUID",
            count: "Cantidad a Generar (Máx 50)",
            letterCase: "Mayúsculas/Minúsculas",
            btnGen: "<i class='fas fa-bolt'></i> Generar UUIDs",
            btnCopy: "<i class='fas fa-copy'></i> Copiar Todo",
            btnClear: "<i class='fas fa-trash-can'></i> Limpiar Lista",
            outTitle: "Resultados Generados",
            empty: "✨ Haga clic en 'Generar UUIDs' para comenzar",
            copied: "Copiado al portapapeles",
            allCopied: "Todos los UUIDs copiados correctamente",
            ad: "<i class='fas fa-rectangle-ad'></i> Publicidad Patrocinada",
            toastGen: "✅ Generado con éxito "
        },
        ja: {
            title: "UUID一括生成器",
            desc: "ブラウザのローカルサンドボックス内で、安全でランダムなUUID v1およびv4文字列を安全に一括生成します。",
            back: "<i class='fas fa-arrow-left'></i> ツールボックスに戻る",
            version: "UUIDのバージョン",
            count: "生成数量 (最大 50)",
            letterCase: "大文字・小文字選択",
            btnGen: "<i class='fas fa-bolt'></i> UUIDを生成する",
            btnCopy: "<i class='fas fa-copy'></i> すべてコピー",
            btnClear: "<i class='fas fa-trash-can'></i> リストをクリア",
            outTitle: "生成されたUUIDプール",
            empty: "✨ パラメータを設定し、生成ボタンをクリックしてください",
            copied: "クリップボードにコピーしました",
            allCopied: "すべてのUUIDをコピーしました",
            ad: "<i class='fas fa-rectangle-ad'></i> スポンサー広告",
            toastGen: "✅ 生成に成功しました: "
        }
    };

    let currentLang = 'en';

    function switchLang(lang) {
        currentLang = lang;
        const t = UUID_LANGS[lang] || UUID_LANGS['en'];
        
        // DOM文本映射更新
        document.title = t.title + " – Online Toolbox";
        document.getElementById('txt-title').innerHTML = `<i class="fas fa-fingerprint"></i> ` + t.title;
        document.getElementById('txt-desc').innerText = t.desc;
        document.getElementById('btn-back').innerHTML = t.back;
        document.getElementById('lbl-version').innerText = t.version;
        document.getElementById('lbl-count').innerText = t.count;
        document.getElementById('lbl-case').innerText = t.letterCase;
        
        document.getElementById('generateBtn').innerHTML = t.btnGen;
        document.getElementById('copyAllBtn').innerHTML = t.btnCopy;
        document.getElementById('clearBtn').innerHTML = t.btnClear;
        document.getElementById('lbl-output-title').innerText = t.outTitle;
        
        document.querySelectorAll('.lbl-ad').forEach(el => el.innerHTML = t.ad);

        // 刷新激活按钮高亮
        document.querySelectorAll('.lang-btn').forEach(b => b.classList.remove('active'));
        const activeBtn = document.getElementById(`lang-${lang}`);
        if(activeBtn) activeBtn.classList.add('active');

        // 持久化并同步主页语种首选项
        localStorage.setItem('user_lang_preference', lang);
        document.documentElement.lang = lang;

        // 如果当前没有生成的数据，刷新空状态占位符
        if(uuids.length === 0) render();
    }

    // 2. 网页颜色（明暗主题）控制器
    function toggleTheme() {
        const currentTheme = document.documentElement.getAttribute('data-theme');
        const targetTheme = currentTheme === 'dark' ? 'light' : 'dark';
        document.documentElement.setAttribute('data-theme', targetTheme);
        localStorage.setItem('user_theme_preference', targetTheme);
    }

    // 初始化主题：默认设置为黑夜极客模式 (dark)
    function initTheme() {
        const savedTheme = localStorage.getItem('user_theme_preference') || 'dark';
        document.documentElement.setAttribute('data-theme', savedTheme);
    }

    function showToast(msg) {
        const box = document.getElementById('toastBox');
        box.innerText = msg; box.classList.add('show');
        setTimeout(() => box.classList.remove('show'), 2000);
    }

    // 3. 原生全量留存的密码学本地 UUID 运算引擎逻辑
    let uuids = [];

    function v1() {
        let d = new Date().getTime();
        if (typeof performance !== 'undefined' && typeof performance.now === 'function'){
            d += performance.now();
        }
        return 'xxxxxxxx-xxxx-1xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, function (c) {
            let r = (d + Math.random() * 16) % 16 | 0;
            d = Math.floor(d / 16);
            return (c === 'x' ? r : (r & 0x3 | 0x8)).toString(16);
        });
    }

    function v4() {
        return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, function(c) {
            let r = Math.random() * 16 | 0, v = c === 'x' ? r : (r & 0x3 | 0x8);
            return v.toString(16);
        });
    }

    const versionSel = document.getElementById('uuidVersion');
    const countInput = document.getElementById('uuidCount');
    const caseSel    = document.getElementById('uuidCase');
    const genBtn     = document.getElementById('generateBtn');
    const copyAll    = document.getElementById('copyAllBtn');
    const clearBtn   = document.getElementById('clearBtn');
    const listDiv    = document.getElementById('uuidList');

    function applyCase(s) { 
        return caseSel.value === 'upper' ? s.toUpperCase() : s.toLowerCase(); 
    }

    // 列表池 DOM 元素实时高效重绘
    function render() {
        if(uuids.length === 0) {
            listDiv.innerHTML = `<div style="text-align:center; padding:2.5rem 1rem; color:var(--color-sub); font-size:0.95rem;">${UUID_LANGS[currentLang].empty}</div>`;
            return;
        }
        let html = '';
        uuids.forEach(u => {
            html += `<div class="uuid-item">
                        <code>${u}</code>
                        <button class="copy-btn" data-uuid="${u}"><i class="fas fa-copy"></i></button>
                     </div>`;
        });
        listDiv.innerHTML = html;

        // 为新生成的列表项一键绑定点击事件
        document.querySelectorAll('.copy-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                navigator.clipboard.writeText(btn.getAttribute('data-uuid'));
                showToast(UUID_LANGS[currentLang].copied);
            });
        });
    }

    // 原生点击“立即批量生成”控制动作流
    function generate() {
        let ver = versionSel.value;
        let n = parseInt(countInput.value) || 1;
        if(n > 50) n = 50;
        if(n < 1) n = 1;
        countInput.value = n; // 容错重置数值输入
        
        let arr = [];
        for(let i = 0; i < n; i++) {
            let raw = ver === 'v1' ? v1() : v4();
            arr.push(applyCase(raw));
        }
        uuids = arr;
        render();
        showToast(UUID_LANGS[currentLang].toastGen + `${n} UUID(s)`);
    }

    // 原生事件绑定挂载
    genBtn.addEventListener('click', generate);

    copyAll.addEventListener('click', () => {
        if (uuids.length) {
            navigator.clipboard.writeText(uuids.join('\n'));
            showToast(UUID_LANGS[currentLang].allCopied);
        }
    });

    clearBtn.addEventListener('click', () => {
        uuids = [];
        render();
    });

    // 构造器：页面生命周期就绪后预装载
    window.addEventListener('DOMContentLoaded', () => {
        initTheme(); // 明暗颜色主题载入
        const storedPreference = localStorage.getItem('user_lang_preference') || 'en';
        switchLang(storedPreference); // 四国多语言环境同步
    });
</script>
