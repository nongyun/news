    <style>

        /* 核心换算执行按钮 */

    <main class="workspace">
        
        <div class="control-group">
            <label id="lbl-type" for="unitType">Measurement Property</label>

                <option value="length" selected>📏 Length / 长度</option>

<script>
    // 1. 全局底层高精度换算字典与算法实现映射 (新增扩充了大量主流实用单位)
    const unitDefs = {
        length: {
            units: ['m', 'cm', 'mm', 'um', 'nm', 'km', 'inch', 'ft', 'yd', 'mi', 'nmi'],
            namesEn: { m: "Meters (m)", cm: "Centimeters (cm)", mm: "Millimeters (mm)", um: "Micrometers (μm)", nm: "Nanometers (nm)", km: "Kilometers (km)", inch: "Inches (in)", ft: "Feet (ft)", yd: "Yards (yd)", mi: "Miles (mi)", nmi: "Nautical Miles (NM)" },
            namesZh: { m: "米 (m)", cm: "厘米 (cm)", mm: "毫米 (mm)", um: "微米 (μm)", nm: "纳米 (nm)", km: "千米 (km)", inch: "英寸 (in)", ft: "英尺 (ft)", yd: "码 (yd)", mi: "英里 (mi)", nmi: "海里 (NM)" },
            namesEs: { m: "Metros (m)", cm: "Centímetros (cm)", mm: "Milímetros (mm)", um: "Micrómetros (μm)", nm: "Nanómetros (nm)", km: "Kilómetros (km)", inch: "Pulgadas (in)", ft: "Pies (ft)", yd: "Yardas (yd)", mi: "Millas (mi)", nmi: "Millas Náuticas (NM)" },
            namesJa: { m: "メートル (m)", cm: "センチ (cm)", mm: "ミリ (mm)", um: "マイクロ (μm)", nm: "ナノ (nm)", km: "キロメートル (km)", inch: "インチ (in)", ft: "フィート (ft)", yd: "ヤード (yd)", mi: "マイル (mi)", nmi: "海里 (NM)" },
            convert: (val, from, to) => {
                const toMeter = { m: 1, cm: 0.01, mm: 0.001, um: 0.000001, nm: 0.000000001, km: 1000, inch: 0.0254, ft: 0.3048, yd: 0.9144, mi: 1609.344, nmi: 1852 };
                return val * toMeter[from] / toMeter[to];
            }
        },
        weight: {
            units: ['kg', 'g', 'mg', 't', 'lb', 'oz', 'ct', 'gr'],
            namesEn: { kg: "Kilograms (kg)", g: "Grams (g)", mg: "Milligrams (mg)", t: "Tonnes (t)", lb: "Pounds (lb)", oz: "Ounces (oz)", ct: "Carats (ct)", gr: "Grains (gr)" },
            namesZh: { kg: "公斤 (kg)", g: "克 (g)", mg: "毫克 (mg)", t: "吨 (t)", lb: "磅 (lb)", oz: "盎司 (oz)", ct: "克拉 (ct)", gr: "格令 (gr)" },
            namesEs: { kg: "Kilogramos (kg)", g: "Gramos (g)", mg: "Miligramos (mg)", t: "Toneladas (t)", lb: "Libras (lb)", oz: "Onzas (oz)", ct: "Quilates (ct)", gr: "Granos (gr)" },
            namesJa: { kg: "キログラム (kg)", g: "グラム (g)", mg: "ミリグラム (mg)", t: "トン (t)", lb: "ポンド (lb)", oz: "オンス (oz)", ct: "カラット (ct)", gr: "グレイン (gr)" },
            convert: (val, from, to) => {
                const toKg = { kg: 1, g: 0.001, mg: 0.000001, t: 1000, lb: 0.45359237, oz: 0.028349523, ct: 0.0002, gr: 0.00006479891 };
                return val * toKg[from] / toKg[to];
            }
        },
        temperature: {
            units: ['c', 'f', 'k'],
            namesEn: { c: "Celsius (°C)", f: "Fahrenheit (°F)", k: "Kelvin (K)" },
            namesZh: { c: "摄氏度 (°C)", f: "华氏度 (°F)", k: "开氏度 (K)" },
            namesEs: { c: "Celsius (°C)", f: "Fahrenheit (°F)", k: "Kelvin (K)" },
            namesJa: { c: "摂氏 (°C)", f: "華氏 (°F)", k: "ケルビン (K)" },
            convert: (val, from, to) => {
                let c;
                if (from === 'c') c = val;
                else if (from === 'f') c = (val - 32) * 5 / 9;
                else c = val - 273.15;

                if (to === 'c') return c;
                if (to === 'f') return c * 9 / 5 + 32;
                return c + 273.15;
            }
        },
        volume: {
            units: ['l', 'ml', 'm3', 'cm3', 'gal', 'floz', 'pt', 'qt'],
            namesEn: { l: "Liters (L)", ml: "Milliliters (mL)", m3: "Cubic Meters (m³)", cm3: "Cubic Centimeters (cm³)", gal: "Gallons (gal)", floz: "Fluid Ounces (fl oz)", pt: "Pints (pt)", qt: "Quarts (qt)" },
            namesZh: { l: "升 (L)", ml: "毫升 (mL)", m3: "立方米 (m³)", cm3: "立方厘米 (cm³)", gal: "加仑 (gal)", floz: "液量盎司 (fl oz)", pt: "品脱 (pt)", qt: "夸脱 (qt)" },
            namesEs: { l: "Litros (L)", ml: "Mililitros (mL)", m3: "Metros Cúbicos (m³)", cm3: "Centímetros Cúbicos (cm³)", gal: "Galones (gal)", floz: "Onzas Líquidas (fl oz)", pt: "Pintas (pt)", qt: "Cuartos (qt)" },
            namesJa: { l: "リットル (L)", ml: "ミリリットル (mL)", m3: "立方メートル (m³)", cm3: "立方センチメートル (cm³)", gal: "ガロン (gal)", floz: "液量オンス (fl oz)", pt: "パイント (pt)", qt: "クォート (qt)" },
            convert: (val, from, to) => {
                const toLiter = { l: 1, ml: 0.001, m3: 1000, cm3: 0.001, gal: 3.785411784, floz: 0.0295735296, pt: 0.473176473, qt: 0.946352946 };
                return val * toLiter[from] / toLiter[to];
            }
        }
    };

    // 2. 国际化四语种核心语言文字字典
    const UNIT_LANGS = {
        en: {
            title: "Unit Converter",
            desc: "Convert length, weight, temperature, and volume metrics seamlessly with extreme numerical accuracy.",
            back: "<i class='fas fa-arrow-left'></i> Back to Hub",
            lblType: "Measurement Property",
            lblValue: "Value to Convert",
            lblFrom: "From Unit",
            lblTo: "To Unit",
            btnCalc: "<i class='fas fa-calculator'></i> Convert Now",
            initRes: "✨ Waiting for calculation",
            errEmpty: "Please enter a valid number",
            ad: "<i class='fas fa-rectangle-ad'></i> Sponsored Advertisement"
        },
        zh: {
            title: "多功能物理单位换算",
            desc: "高精度支持长度、重量、温度及公英制体积转换，内置科学记数规则与交叉比例计算内核。",
            back: "<i class='fas fa-arrow-left'></i> 返回工具箱",
            lblType: "选择物理量类型",
            lblValue: "请输入需要换算的数值",
            lblFrom: "原始单位",
            lblTo: "目标单位",
            btnCalc: "<i class='fas fa-calculator'></i> 立即执行单位换算",
            initRes: "✨ 等待计算结果",
            errEmpty: "请输入有效的计算数值",
            ad: "<i class='fas fa-rectangle-ad'></i> 赞助商广告"
        },
        es: {
            title: "Conversor de Unidades",
            desc: "Convierta métricas de longitud, peso, temperatura y volumen sin problemas con extrema precisión numérica.",
            back: "<i class='fas fa-arrow-left'></i> Volver al menú",
            lblType: "Propiedad de Medición",
            lblValue: "Valor a Convertir",
            lblFrom: "Unidad de Origen",
            lblTo: "Unidad de Destino",
            btnCalc: "<i class='fas fa-calculator'></i> Convertir Ahora",
            initRes: "✨ Esperando cálculo",
            errEmpty: "Por favor, introduzca un número válido",
            ad: "<i class='fas fa-rectangle-ad'></i> Publicidad Patrocinada"
        },
        ja: {
            title: "単位換算ジェネレーター",
            desc: "長さ、重量、温度、体積の指標を、極めて高い数値精度でシームレスに換算します。",
            back: "<i class='fas fa-arrow-left'></i> ツールボックスに戻る",
            lblType: "測定プロパティの種類",
            lblValue: "換算する数値",
            lblFrom: "変換元の単位",
            lblTo: "変換先の単位",
            btnCalc: "<i class='fas fa-calculator'></i> 単位を換算する",
            initRes: "✨ 計算結果を待っています",
            errEmpty: "有効な数値を入力してください",
            ad: "<i class='fas fa-rectangle-ad'></i> スポンサー広告"
        }
    };

    let currentLang = 'en';

    // 动态装配生成子级单位下拉列表项
    function populateUnits() {
        const typeSel = document.getElementById('unitType');
        const fromSel = document.getElementById('fromUnit');
        const toSel = document.getElementById('toUnit');
        
        let type = typeSel.value;
        let def = unitDefs[type];
        
        // 根据当前的国际化设定选择对应的文字显示映射集
        let key = 'names' + currentLang.charAt(0).toUpperCase() + currentLang.slice(1);
        let names = def[key] || def.namesEn;
        
        // 保存当前选中的单位，避免在切换语言时重置选项
        let lastFrom = fromSel.value;
        let lastTo = toSel.value;
        
        // 双向清空重建
        fromSel.innerHTML = '';
        toSel.innerHTML = '';
        
        def.units.forEach(u => {
            let opt = document.createElement('option');
            opt.value = u;
            opt.innerText = names[u];
            fromSel.appendChild(opt.cloneNode(true));
            toSel.appendChild(opt);
        });
        
        // 恢复之前选中的单位，如果是新类型则赋予合理的对位初始值
        if (lastFrom && def.units.includes(lastFrom) && lastTo && def.units.includes(lastTo)) {
            fromSel.value = lastFrom;
            toSel.value = lastTo;
        } else if (type === "temperature") {
            fromSel.value = "c";
            toSel.value = "f";
        } else {
            fromSel.value = def.units[0];
            toSel.value = def.units[1] || def.units[0];
        }
    }

    function switchLang(lang) {
        currentLang = lang;
        const t = UNIT_LANGS[lang] || UNIT_LANGS['en'];
        
        // DOM 文字树渲染替换
        document.title = t.title + " – Online Toolbox";
        document.getElementById('txt-title').innerHTML = `<i class="fas fa-ruler-combined"></i> ` + t.title;
        document.getElementById('txt-desc').innerText = t.desc;
        document.getElementById('btn-back').innerHTML = t.back;
        document.getElementById('lbl-type').innerText = t.lblType;
        document.getElementById('lbl-value').innerText = t.lblValue;
        document.getElementById('lbl-from').innerText = t.lblFrom;
        document.getElementById('lbl-to').innerText = t.lblTo;
        document.getElementById('convertBtn').innerHTML = t.btnCalc;
        
        document.querySelectorAll('.lbl-ad').forEach(el => el.innerHTML = t.ad);

        // 重载子菜单名称文字以进行实时变轨
        populateUnits();

        if (document.getElementById('resultText').innerText.includes('✨') || document.getElementById('resultText').innerText.includes('Waiting') || document.getElementById('resultText').innerText.includes('等待')) {
            document.getElementById('resultText').innerText = t.initRes;
        } else {
            convert(); // 切换语言时已有数据则同步重新格式化刷新
        }

        // 高亮语言标签状态
        document.querySelectorAll('.lang-btn').forEach(b => b.classList.remove('active'));
        const activeBtn = document.getElementById(`lang-${lang}`);
        if(activeBtn) activeBtn.classList.add('active');

        localStorage.setItem('user_lang_preference', lang);
        document.documentElement.lang = lang;
    }

    // 3. 网页颜色风格明暗调度中心
    function toggleTheme() {
        const currentTheme = document.documentElement.getAttribute('data-theme');
        const targetTheme = currentTheme === 'dark' ? 'light' : 'dark';
        document.documentElement.setAttribute('data-theme', targetTheme);
        localStorage.setItem('user_theme_preference', targetTheme);
    }

    function initTheme() {
        const savedTheme = localStorage.getItem('user_theme_preference') || 'dark';
        document.documentElement.setAttribute('data-theme', savedTheme);
    }

    // 4. 原生换算交互执行逻辑
    function convert() {
        const typeSel = document.getElementById('unitType').value;
        const fromSel = document.getElementById('fromUnit').value;
        const toSel = document.getElementById('toUnit').value;
        const valueInp = parseFloat(document.getElementById('unitValue').value);
        const t = UNIT_LANGS[currentLang] || UNIT_LANGS['en'];

        if (isNaN(valueInp)) {
            document.getElementById('resultText').innerText = t.errEmpty;
            return;
        }

        const def = unitDefs[typeSel];
        const result = def.convert(valueInp, fromSel, toSel);

        let key = 'names' + currentLang.charAt(0).toUpperCase() + currentLang.slice(1);
        let names = def[key] || def.namesEn;

        // 去除多余的小数尾巴保留合理科学精度，对于极小的值使用科学记数法或更多保留位数
        let formattedResult = result;
        if (Math.abs(result) < 0.000001 && result !== 0) {
            formattedResult = result.toExponential(4);
        } else {
            formattedResult = Number(result.toFixed(6));
        }

        document.getElementById('resultText').innerHTML = `<strong>${valueInp}</strong> ${names[fromSel]} = <strong style="color:#3b82f6; font-size:1.5rem;">${formattedResult}</strong> ${names[toSel]}`;
    }

    // 页面构建阶段自动对齐首选项数据
    window.addEventListener('DOMContentLoaded', () => {
        initTheme(); // 默认切入高阶黑夜
        const storedPreference = localStorage.getItem('user_lang_preference') || 'en';
        switchLang(storedPreference);
    });
</script>
